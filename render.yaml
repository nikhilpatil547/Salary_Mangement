# Render Blueprint: New > Blueprint, pick this repository, Apply.
# Creates the Postgres database and the web service; the first boot seeds 10,000 employees.
databases:
  - name: salary-management-db
    plan: free
    databaseName: salary_management
    postgresMajorVersion: "16"

services:
  - type: web
    name: salary-management
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
