default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: salary_management_development

test:
  <<: *default
  database: salary_management_test

# Production reads DATABASE_URL, which overrides the settings above.
production:
  <<: *default
  database: salary_management_production
